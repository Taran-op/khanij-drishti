apiVersion: v1
kind: Namespace
metadata: {name: khanij-drishti}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: kd-config, namespace: khanij-drishti}
data:
  KD_DATA_DIR: /var/lib/khanij-drishti/data
  KD_MODELS_DIR: /var/lib/khanij-drishti/models
  KD_DEMO_LOGIN: "0"
  KD_SCHEDULER: "0"
  KD_LIVE_FEED: "0"
  KD_WORKER: external
  KD_ALLOWED_ORIGINS: https://khanij.example.gov.in
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: kd-data, namespace: khanij-drishti}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 100Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: kd-models, namespace: khanij-drishti}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 50Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgis, namespace: khanij-drishti}
spec:
  selector: {app: postgis}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgis, namespace: khanij-drishti}
spec:
  serviceName: postgis
  replicas: 1
  selector: {matchLabels: {app: postgis}}
  template:
    metadata: {labels: {app: postgis}}
    spec:
      securityContext: {fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4
          env:
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: kd-secrets, key: POSTGRES_DB}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: kd-secrets, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: kd-secrets, key: POSTGRES_PASSWORD}}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 10, periodSeconds: 5}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 4Gi}}
          volumeMounts: [{name: database, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: database}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 100Gi}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: kd-migrate, namespace: khanij-drishti}
spec:
  backoffLimit: 5
  template:
    metadata: {labels: {app: kd-migrate}}
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: registry.example.gov.in/khanij/backend:1.0.0
          command: [python, -m, kd.migrate]
          envFrom: [{configMapRef: {name: kd-config}}, {secretRef: {name: kd-secrets}}]
          volumeMounts: [{name: data, mountPath: /var/lib/khanij-drishti/data}, {name: models, mountPath: /var/lib/khanij-drishti/models}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: kd-data}}, {name: models, persistentVolumeClaim: {claimName: kd-models}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: khanij-drishti}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: registry.example.gov.in/khanij/backend:1.0.0
          command: [uvicorn, kd.api:app, --host, 0.0.0.0, --port, "8000", --proxy-headers]
          envFrom: [{configMapRef: {name: kd-config}}, {secretRef: {name: kd-secrets}}]
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 60, periodSeconds: 30}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 4Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/khanij-drishti/data}, {name: models, mountPath: /var/lib/khanij-drishti/models}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: kd-data}}, {name: models, persistentVolumeClaim: {claimName: kd-models}}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: khanij-drishti, labels: {app: api}}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: khanij-drishti}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: registry.example.gov.in/khanij/backend:1.0.0
          command: [python, -m, kd.jobs, worker]
          envFrom: [{configMapRef: {name: kd-config}}, {secretRef: {name: kd-secrets}}]
          resources: {requests: {cpu: "1", memory: 2Gi}, limits: {cpu: "4", memory: 8Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/khanij-drishti/data}, {name: models, mountPath: /var/lib/khanij-drishti/models}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: kd-data}}, {name: models, persistentVolumeClaim: {claimName: kd-models}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scheduler, namespace: khanij-drishti}
spec:
  replicas: 1
  selector: {matchLabels: {app: scheduler}}
  template:
    metadata: {labels: {app: scheduler}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scheduler
          image: registry.example.gov.in/khanij/backend:1.0.0
          command: [python, -m, kd.scheduler]
          envFrom: [{configMapRef: {name: kd-config}}, {secretRef: {name: kd-secrets}}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 1Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/khanij-drishti/data}, {name: models, mountPath: /var/lib/khanij-drishti/models}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: kd-data}}, {name: models, persistentVolumeClaim: {claimName: kd-models}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: khanij-drishti}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: registry.example.gov.in/khanij/frontend:1.0.0
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: khanij-drishti}
spec:
  selector: {app: frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: khanij-drishti
  namespace: khanij-drishti
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  tls: [{hosts: [khanij.example.gov.in], secretName: kd-tls}]
  rules:
    - host: khanij.example.gov.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 8080}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: khanij-drishti}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: khanij-drishti}
spec: {minAvailable: 1, selector: {matchLabels: {app: api}}}
