apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: kd-api, namespace: khanij-drishti, labels: {release: prometheus}}
spec:
  selector: {matchLabels: {app: api}}
  endpoints: [{port: http, path: /metrics, interval: 15s}]
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: kd-alerts, namespace: khanij-drishti, labels: {release: prometheus}}
spec:
  groups:
    - name: khanij-drishti
      rules:
        - alert: KhanijApiDown
          expr: up{job=~".*kd-api.*"} == 0
          for: 5m
          labels: {severity: critical}
          annotations: {summary: KhanijSetu API is unavailable}
        - alert: IngestionDeadLetters
          expr: increase(kd_ingest_dead_letter[15m]) > 0
          labels: {severity: warning}
          annotations: {summary: Telemetry records entered the dead-letter queue}
        - alert: ModelInputDrift
          expr: kd_feature_psi > 0.25
          for: 30m
          labels: {severity: warning}
          annotations: {summary: Model input drift exceeded PSI 0.25}
